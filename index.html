<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Loading...</title>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16.png?v=2" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180">
  <style>
    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    .loading {
      position: relative;
      color: #c0caf5;
      font: 700 12px/1 "Courier New", "Liberation Mono", monospace;
      letter-spacing: .11em;
      text-shadow:
        0 0 2px rgba(192, 202, 245, .95),
        0 0 8px rgba(122, 162, 247, .58),
        0 0 18px rgba(187, 154, 247, .22);
      animation: pixel-glow 2.2s steps(5, end) infinite;
    }

    .loading::after {
      position: absolute;
      inset: 0;
      content: attr(data-text);
      color: #bb9af7;
      opacity: 0;
      clip-path: inset(42% 0 34% 0);
      pointer-events: none;
      animation: pixel-skip 3.1s steps(1, end) infinite;
    }

    .dots { white-space: nowrap; }

    @keyframes pixel-glow {
      0%, 100% { opacity: .72; }
      45% { opacity: 1; }
      50% { opacity: .88; transform: translateX(1px); }
      55% { opacity: 1; transform: translateX(0); }
    }

    @keyframes pixel-skip {
      0%, 91%, 94%, 100% { opacity: 0; transform: translateX(0); }
      92% { opacity: .42; transform: translateX(-1px); }
      93% { opacity: .26; transform: translateX(1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading, .loading::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="loading" data-text="Loading..." role="status" aria-label="Loading...">
    <span aria-hidden="true">Loading<span class="dots">...</span></span>
  </div>
</body>
</html>
