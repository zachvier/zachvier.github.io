<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zach Vivier — technical support engineer and technical writer.">
  <meta name="theme-color" content="#15191c">
  <title>Zach Vivier — Technical Support &amp; Writing</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --background: #15191c;
      --surface: #1d2228;
      --border: #303740;
      --text: #d9dde3;
      --muted: #b9bec7;
      --link: #82b2f2;
      --link-hover: #a9caff;
      --focus: #b8d5ff;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --link: #0969da;
      --link-hover: #0550ae;
      --focus: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .page {
      width: 100%;
      padding: 52px 16px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      min-width: 0;
      margin: 9px 0 0;
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .theme-toggle {
      min-width: 108px;
      min-height: 60px;
      padding: 10px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: clamp(1.125rem, 1.65vw, 1.625rem);
      line-height: 1.2;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .theme-toggle:hover {
      border-color: var(--muted);
    }

    main {
      margin-top: 39px;
    }

    .role {
      margin: 0 0 28px;
      color: var(--text);
      font-size: clamp(1.125rem, 1.65vw, 1.625rem);
      line-height: 1.35;
    }

    .profiles {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 13px;
    }

    a {
      color: var(--link);
      font-size: clamp(1.125rem, 1.65vw, 1.625rem);
      line-height: 1.35;
      text-underline-offset: 0.12em;
      text-decoration-thickness: 1px;
      transition: color 120ms ease;
    }

    a:hover {
      color: var(--link-hover);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px 18px;
      }

      .masthead {
        gap: 12px;
      }

      h1 {
        margin-top: 7px;
      }

      .theme-toggle {
        min-width: auto;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 9px;
        font-size: 1rem;
      }

      main {
        margin-top: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .theme-toggle,
      a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Directory: /zachvivier/</h1>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">Light</button>
    </header>

    <main>
      <p class="role">Technical support engineer and technical writer.</p>
      <nav class="profiles" aria-label="Profiles">
        <a href="https://github.com/zachvivier">GitHub/</a>
        <a href="https://www.linkedin.com/in/zachvivier/">LinkedIn/</a>
      </nav>
    </main>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    let isLightTheme = false;

    const setTheme = (useLightTheme) => {
      root.dataset.theme = useLightTheme ? 'light' : 'dark';
      toggle.textContent = useLightTheme ? 'Dark' : 'Light';
      toggle.setAttribute('aria-label', `Switch to ${useLightTheme ? 'dark' : 'light'} theme`);
      themeColor.content = useLightTheme ? '#f6f8fa' : '#15191c';
    };

    toggle.addEventListener('click', () => {
      isLightTheme = !isLightTheme;
      setTheme(isLightTheme);
    });

    setTheme(isLightTheme);
  </script>
</body>
</html>
